name: After merge
# Stand-in for the post-merge label (today the merge driver adds it on the Mac).
on:
  pull_request:
    types: [closed]
permissions:
  pull-requests: write
  issues: write
jobs:
  label:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Label the merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr edit "$PR" --repo "$REPO" --add-label merged-by-queue
